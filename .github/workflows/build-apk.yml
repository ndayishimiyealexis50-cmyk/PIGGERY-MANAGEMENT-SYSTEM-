name: Build FarmIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCBH-3ql8onw17geHrJXKUwdhN-EVjtg14"
          VITE_FIREBASE_AUTH_DOMAIN: "my-farm-track.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "my-farm-track"
          VITE_FIREBASE_STORAGE_BUCKET: "my-farm-track.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "529287963399"
          VITE_FIREBASE_APP_ID: "1:529287963399:web:733a9828916b61f4525ba2"
          VITE_FIREBASE_MEASUREMENT_ID: "G-064719MRR4"
      - run: mkdir -p www && cp index.html www/
      - run: npx cap add android || true
      - run: npx cap sync android
      - uses: android-actions/setup-android@v3
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FarmIQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
